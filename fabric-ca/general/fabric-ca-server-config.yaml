# PQC copy (qchain-network-pqc, 2026-10-31): ML-DSA-44 CA per ~/fabric-ca/docs/source/pqc-mldsa.md.
# Changes vs qchain-network (see CHANGES-PQC.md):
#   - bccsp.default PQC (upper case; lower case is refused), no bccsp.pqc.password (refused).
#   - ca.certfile/keyfile = the cryptogen GeneralMSP CA cert/key (design b1, D7 shortcut), copied into
#     cafiles/ by scripts/generate-crypto-pqc.sh at run time; CA-issued users chain to the channel MSP root.
#   - server TLS from EXTERNAL ECDSA P-256 files tls/tls-cert.pem + tls/tls-key.pem (a PQC CA refuses TLS
#     without a key file); clients trust tls/tls-cert.pem via --tls.certfiles.
#   - csr.keyrequest.algo mldsa44; signing.default usage [digital signature]; the source's "tls" profile
#     (key encipherment / key agreement) removed: unused in b1 and unfit for ML-DSA.
#   - port 28054. Registry, db and affiliations unchanged.
version: 1.2.0
port: 28054
debug: false

tls:
  enabled: true
  certfile: tls/tls-cert.pem
  keyfile: tls/tls-key.pem

ca:
  name: GeneralCA
  certfile: cafiles/ca.general.uae.com-cert.pem
  keyfile: cafiles/priv_sk
  chainfile:

registry:
  maxenrollments: -1
  identities:
    - name: admin
      pass: adminpw
      type: client
      affiliation: ""
      attrs:
        hf.Registrar.Roles: "*"
        hf.Registrar.DelegateRoles: "*"
        hf.Revoker: true
        hf.IntermediateCA: true
        hf.GenCRL: true
        hf.Registrar.Attributes: "*"
        hf.AffiliationMgr: true

db:
  type: sqlite3
  datasource: fabric-ca-server.db

csr:
  cn: ca.general.uae.com
  keyrequest:
    algo: mldsa44
  names:
    - C: AE
      ST: Sharjah
      L: Sharjah
      O: general.uae.com
      OU:
  hosts:
    - localhost
    - ca.general.uae.com

signing:
  default:
    usage:
      - digital signature
    expiry: 8760h
  profiles:
    ca:
      usage: [cert sign, crl sign]
      expiry: 43800h
      caconstraint:
        isca: true
        maxpathlen: 0

bccsp:
  default: PQC
  pqc:
    keystorepath: msp/keystore

affiliations:
  general:
    - issuer
    - verifier
