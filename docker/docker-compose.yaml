# PQC network (2026-10-31). Changes from the classical network, tag classical-network-final (see CHANGES-PQC.md):
#   - project qchainpqc; every container/volume/network named qchainpqc_*; ports on 127.0.0.1 only,
#     container port = host port (27050/27053 orderer, 27051 peer0.government, 29051 peer0.general);
#     operations ports 3xxxx, not published.
#   - images qchain-pqc/* (PQC builds); stock hyperledger/* images cannot run ML-DSA identities.
#   - crypto from crypto-material/ (cryptogen ML-DSA-44, scripts/generate-crypto-pqc.sh), mounted read-only;
#     node configs from ../config (BCCSP PQC) mounted read-only.
#   - no docker.sock / CORE_VM_*: chaincode runs as a service (chaincode-qchaincode, ccaas).
#   - state DB goleveldb, no CouchDB; ipfs behind profile "ipfs"; qchain-server dropped (stale build path).
#   - uid 1000, read-only root filesystem, tmpfs /tmp mode 1777.
#   - restart unless-stopped: the containers come back after a Docker or machine restart.
# Start/stop with scripts/start-fabric-network.sh / stop-fabric-network.sh (docker compose -p qchainpqc).
name: qchainpqc

x-node: &node
  user: "1000:1000"
  read_only: true
  tmpfs: ["/tmp:mode=1777"]
  restart: unless-stopped
  stop_grace_period: 10s

networks:
  fabric_net:
    name: qchainpqc_net

volumes:
  orderer0.orderer.example.com:
    name: qchainpqc_orderer0-data
  peer0.government.uae.com:
    name: qchainpqc_peer0gov-data
  peer0.general.uae.com:
    name: qchainpqc_peer0gen-data
  ipfs_staging:
    name: qchainpqc_ipfs-staging
  ipfs_data:
    name: qchainpqc_ipfs-data

services:

  orderer0.orderer.example.com:
    <<: *node
    image: qchain-pqc/orderer:e472b4ea
    container_name: qchainpqc_orderer0.orderer.example.com
    hostname: orderer0.orderer.example.com
    mem_limit: 384m
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=27050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:27053
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTAUTHREQUIRED=true
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:38443
    volumes:
      - ../config/orderer.yaml:/etc/hyperledger/fabric/orderer.yaml:ro
      - ../crypto-material/ordererOrganizations/orderer.example.com/orderers/orderer0.orderer.example.com/msp:/var/hyperledger/orderer/msp:ro
      - ../crypto-material/ordererOrganizations/orderer.example.com/orderers/orderer0.orderer.example.com/tls:/var/hyperledger/orderer/tls:ro
      - ../crypto-material/ordererOrganizations/orderer.example.com/orderers/orderer0.orderer.example.com/pqc-keystore:/var/hyperledger/orderer/pqc-keystore:ro
      - orderer0.orderer.example.com:/var/hyperledger/production
    ports:
      - 127.0.0.1:27050:27050
      - 127.0.0.1:27053:27053
    networks:
      fabric_net:
        aliases: [orderer0.orderer.example.com]

  peer0.government.uae.com:
    <<: *node
    image: qchain-pqc/peer:e472b4ea
    container_name: qchainpqc_peer0.government.uae.com
    hostname: peer0.government.uae.com
    mem_limit: 512m
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.government.uae.com
      - CORE_PEER_ADDRESS=peer0.government.uae.com:27051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:27051
      - CORE_PEER_CHAINCODEADDRESS=peer0.government.uae.com:27052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:27052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.government.uae.com:27051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.government.uae.com:27051
      - CORE_PEER_LOCALMSPID=GovernmentMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_FILESYSTEMPATH=/var/hyperledger/production
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:39444
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    volumes:
      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ../crypto-material/peerOrganizations/government.uae.com/peers/peer0.government.uae.com/msp:/etc/hyperledger/fabric/msp:ro
      - ../crypto-material/peerOrganizations/government.uae.com/peers/peer0.government.uae.com/tls:/etc/hyperledger/fabric/tls:ro
      - ../crypto-material/peerOrganizations/government.uae.com/peers/peer0.government.uae.com/pqc-keystore:/etc/hyperledger/fabric/pqc-keystore:ro
      - peer0.government.uae.com:/var/hyperledger/production
    ports:
      - 127.0.0.1:27051:27051
    networks:
      fabric_net:
        aliases: [peer0.government.uae.com]

  peer0.general.uae.com:
    <<: *node
    image: qchain-pqc/peer:e472b4ea
    container_name: qchainpqc_peer0.general.uae.com
    hostname: peer0.general.uae.com
    mem_limit: 512m
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.general.uae.com
      - CORE_PEER_ADDRESS=peer0.general.uae.com:29051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:29051
      - CORE_PEER_CHAINCODEADDRESS=peer0.general.uae.com:29052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:29052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.general.uae.com:29051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.general.uae.com:29051
      - CORE_PEER_LOCALMSPID=GeneralMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_FILESYSTEMPATH=/var/hyperledger/production
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:39445
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    volumes:
      - ../config/core.yaml:/etc/hyperledger/fabric/core.yaml:ro
      - ../crypto-material/peerOrganizations/general.uae.com/peers/peer0.general.uae.com/msp:/etc/hyperledger/fabric/msp:ro
      - ../crypto-material/peerOrganizations/general.uae.com/peers/peer0.general.uae.com/tls:/etc/hyperledger/fabric/tls:ro
      - ../crypto-material/peerOrganizations/general.uae.com/peers/peer0.general.uae.com/pqc-keystore:/etc/hyperledger/fabric/pqc-keystore:ro
      - peer0.general.uae.com:/var/hyperledger/production
    ports:
      - 127.0.0.1:29051:29051
    networks:
      fabric_net:
        aliases: [peer0.general.uae.com]

  # Chaincode as a service (ccaas). Started by scripts/deployCC-pqc.sh after install, which sets
  # QCHAINCODE_PACKAGE_ID; profile "chaincode" keeps it out of a plain `up`. Not published.
  chaincode-qchaincode:
    <<: *node
    image: qchain-pqc/ccaas-qchain:2.0
    container_name: qchainpqc_chaincode-qchaincode
    hostname: chaincode-qchaincode
    profiles: [chaincode]
    mem_limit: 192m
    environment:
      - CHAINCODE_ID=${QCHAINCODE_PACKAGE_ID:-unset-run-scripts-deployCC-pqc.sh}
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:9998
    networks:
      fabric_net:
        aliases: [chaincode-qchaincode]

  # Optional IPFS node (profile "ipfs"); QChain normally uses a systemd IPFS daemon instead.
  ipfs:
    image: ipfs/kubo:latest
    container_name: qchainpqc_ipfs
    profiles: [ipfs]
    restart: unless-stopped
    environment:
      - IPFS_PROFILE=server
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs
    ports:
      - 127.0.0.1:24001:4001       # swarm (p2p)
      - 127.0.0.1:25001:5001       # API
      - 127.0.0.1:28080:8080       # gateway
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fabric_net
